<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>新しいタブ</title>
  <style>
    :root { color-scheme: dark; --g1: #1d2b22; --g2: #14201a; --accent: #9fd48b; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      background: radial-gradient(1400px 700px at 50% -10%, var(--g1), var(--g2) 70%);
      color: #e8eaed;
      font-family: "Segoe UI", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
      overflow-x: hidden;
    }
    /* 木漏れ日: ゆっくり揺れる光の粒 */
    .spots { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .spot {
      position: absolute; border-radius: 50%; filter: blur(40px); opacity: .22;
      background: radial-gradient(circle, #f3e6a8, transparent 70%);
      animation: drift 18s ease-in-out infinite alternate;
    }
    .spot:nth-child(1) { width: 380px; height: 380px; left: 8%;  top: 6%;  animation-duration: 21s; }
    .spot:nth-child(2) { width: 280px; height: 280px; left: 62%; top: 12%; animation-duration: 17s; animation-delay: -6s; opacity: .16; }
    .spot:nth-child(3) { width: 220px; height: 220px; left: 78%; top: 58%; animation-duration: 25s; animation-delay: -11s; }
    .spot:nth-child(4) { width: 320px; height: 320px; left: 22%; top: 64%; animation-duration: 19s; animation-delay: -3s; opacity: .14; }
    @keyframes drift { from { transform: translate(-30px, -20px) scale(1); } to { transform: translate(40px, 30px) scale(1.18); } }

    main { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; padding: 9vh 24px 48px; display: flex; flex-direction: column; align-items: center; gap: 30px; }
    .clock { font-size: 84px; font-weight: 200; letter-spacing: 2px; line-height: 1; }
    .date { color: #aab3ab; font-size: 15px; margin-top: 8px; text-align: center; }
    .hello { color: var(--accent); font-size: 14px; margin-top: 2px; text-align: center; }

    form {
      display: flex; align-items: center; width: min(620px, 92%); height: 52px; padding: 0 20px;
      background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 26px; backdrop-filter: blur(8px);
    }
    form:focus-within { background: rgba(255, 255, 255, .13); border-color: var(--accent); }
    svg { width: 20px; height: 20px; fill: #9aa0a6; flex: none; }
    input {
      flex: 1; border: 0; outline: 0; background: transparent; color: #e8eaed;
      font-size: 16px; margin-left: 12px; font-family: inherit;
    }
    .tip { color: #7f8a82; font-size: 12px; margin-top: -16px; text-align: center; }

    .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px 10px; width: min(620px, 92%); }
    a.sc { display: flex; flex-direction: column; align-items: center; gap: 7px; color: #c3c9c4; text-decoration: none; font-size: 11.5px; min-width: 0; }
    a.sc .ic {
      width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center;
      font-size: 20px; font-weight: 700; color: #1c1f21; transition: transform .15s;
    }
    a.sc:hover .ic { transform: translateY(-3px); }
    a.sc span.nm { max-width: 90px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; width: 100%; }
    .card {
      background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 16px; padding: 16px 18px; backdrop-filter: blur(8px);
    }
    .card h3 { margin: 0 0 12px; font-size: 13px; font-weight: 600; color: var(--accent); letter-spacing: .5px; }
    .todo-add { display: flex; gap: 6px; margin-bottom: 10px; }
    .todo-add input { margin: 0; height: 32px; padding: 0 12px; background: rgba(0, 0, 0, .25); border-radius: 8px; font-size: 13px; }
    .todo-add button, .btn {
      border: 0; border-radius: 8px; background: var(--accent); color: #17230f; font-weight: 600;
      padding: 0 14px; height: 32px; cursor: pointer; font-family: inherit; font-size: 12.5px;
    }
    .btn.ghost { background: rgba(255, 255, 255, .1); color: #e8eaed; font-weight: 500; }
    .btn:hover { filter: brightness(1.08); }
    ul { list-style: none; margin: 0; padding: 0; max-height: 190px; overflow-y: auto; }
    li { display: flex; align-items: center; gap: 10px; padding: 6px 2px; font-size: 13.5px; }
    li.done span { text-decoration: line-through; color: #7f8a82; }
    li span { flex: 1; word-break: break-all; }
    li input[type=checkbox] { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
    li button { border: 0; background: transparent; color: #7f8a82; cursor: pointer; font-size: 14px; }
    li button:hover { color: #f28b82; }
    .empty { color: #7f8a82; font-size: 12.5px; padding: 6px 2px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .card p { margin: 0 0 12px; color: #aab3ab; font-size: 12.5px; line-height: 1.7; }
    .closed a { display: block; color: #c3c9c4; text-decoration: none; padding: 5px 2px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .closed a:hover { color: var(--accent); }
    footer { color: #6f7a72; font-size: 12px; margin-top: 6px; text-align: center; line-height: 1.9; }
    kbd { padding: 1px 6px; border-radius: 5px; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .12); font: 11px "Segoe UI", sans-serif; }
  </style>
</head>
<body>
  <div class="spots"><div class="spot"></div><div class="spot"></div><div class="spot"></div><div class="spot"></div></div>

  <main>
    <div>
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date"></div>
      <div class="hello" id="hello"></div>
    </div>

    <form id="q">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      <input id="i" type="text" autofocus autocomplete="off" spellcheck="false" placeholder="検索 または URL を入力" />
    </form>
    <div class="tip">「yt ねこ」「gh electron」「map 東京駅」のように先頭にキーワードを付けるとサイト内検索できます</div>

    <nav class="grid" id="grid"></nav>

    <div class="cards">
      <section class="card">
        <h3>TODO</h3>
        <div class="todo-add">
          <input id="todo-in" type="text" placeholder="やることを追加して Enter" autocomplete="off" />
          <button id="todo-btn">追加</button>
        </div>
        <ul id="todo"></ul>
      </section>

      <section class="card">
        <h3>集中モード</h3>
        <p>気が散るサイトをブロックして、時間を決めて集中します。</p>
        <div class="row">
          <button class="btn" data-cmd="focus.start25">25分</button>
          <button class="btn" data-cmd="focus.start50">50分</button>
          <button class="btn ghost" data-cmd="panel.notes">メモを開く</button>
        </div>
      </section>

      <section class="card" id="closed-card" hidden>
        <h3>最近閉じたタブ</h3>
        <div class="closed" id="closed"></div>
      </section>
    </div>

    <footer>
      <kbd>Ctrl</kbd>+<kbd>K</kbd> コマンドパレット　<kbd>Alt</kbd>+<kbd>S</kbd> 分割表示　<kbd>F9</kbd> リーダーモード　<kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>L</kbd> 縦タブ
    </footer>
  </main>

  <script>
    const API = window.komorebiNewtab;

    // 時間帯で背景の色を変える
    function palette(h) {
      if (h >= 5 && h < 10) return ['#2a3a2a', '#18241c', '朝'];
      if (h >= 10 && h < 16) return ['#1f3a33', '#142620', '昼'];
      if (h >= 16 && h < 19) return ['#3b2f26', '#221a16', '夕方'];
      return ['#1a2236', '#10151f', '夜'];
    }
    function tick() {
      const d = new Date();
      const p = (n) => String(n).padStart(2, '0');
      document.getElementById('clock').textContent = `${p(d.getHours())}:${p(d.getMinutes())}`;
      const wd = '日月火水木金土'[d.getDay()];
      document.getElementById('date').textContent = `${d.getMonth() + 1}月${d.getDate()}日（${wd}）`;
      const [g1, g2] = palette(d.getHours());
      document.documentElement.style.setProperty('--g1', g1);
      document.documentElement.style.setProperty('--g2', g2);
      const h = d.getHours();
      document.getElementById('hello').textContent =
        h < 5 ? 'こんな時間まで、おつかれさまです' : h < 11 ? 'おはようございます' : h < 17 ? 'こんにちは' : h < 22 ? 'こんばんは' : 'そろそろ休みましょう';
    }
    tick();
    setInterval(tick, 10000);

    // 検索（先頭キーワードによるサイト内検索はメインプロセス側で解釈する）
    document.getElementById('q').addEventListener('submit', (e) => {
      e.preventDefault();
      const v = document.getElementById('i').value.trim();
      if (v && API) API.go(v);
    });

    // ショートカット（ブックマーク）
    function hue(s) { let x = 0; for (const c of s) x = (x * 31 + c.charCodeAt(0)) % 360; return x; }
    const hostOf = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return ''; } };
    function addShortcut(parent, title, url) {
      const a = document.createElement('a');
      a.className = 'sc';
      a.href = url;
      const ic = document.createElement('div');
      ic.className = 'ic';
      const seed = hostOf(url) || title;
      ic.textContent = (seed || '?').charAt(0).toUpperCase();
      ic.style.background = `hsl(${hue(seed)} 55% 72%)`;
      const nm = document.createElement('span');
      nm.className = 'nm';
      nm.textContent = title || seed;
      a.append(ic, nm);
      parent.appendChild(a);
    }

    // TODO（このPC内のlocalStorageに保存）
    let todos = [];
    try { todos = JSON.parse(localStorage.getItem('komorebi.todos') || '[]'); } catch { todos = []; }
    function saveTodos() { try { localStorage.setItem('komorebi.todos', JSON.stringify(todos)); } catch { /* 保存できない環境は無視 */ } }
    function renderTodos() {
      const ul = document.getElementById('todo');
      ul.replaceChildren();
      if (!todos.length) {
        const e = document.createElement('div');
        e.className = 'empty';
        e.textContent = 'タスクはありません';
        ul.appendChild(e);
        return;
      }
      todos.forEach((t, i) => {
        const li = document.createElement('li');
        if (t.done) li.className = 'done';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = !!t.done;
        cb.addEventListener('change', () => { t.done = cb.checked; saveTodos(); renderTodos(); });
        const sp = document.createElement('span');
        sp.textContent = t.text;
        const x = document.createElement('button');
        x.textContent = '✕';
        x.title = '削除';
        x.addEventListener('click', () => { todos.splice(i, 1); saveTodos(); renderTodos(); });
        li.append(cb, sp, x);
        ul.appendChild(li);
      });
    }
    function addTodo() {
      const inp = document.getElementById('todo-in');
      const v = inp.value.trim();
      if (!v) return;
      todos.push({ text: v, done: false });
      inp.value = '';
      saveTodos();
      renderTodos();
    }
    document.getElementById('todo-btn').addEventListener('click', addTodo);
    document.getElementById('todo-in').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) addTodo(); });
    renderTodos();

    // コマンドボタン
    document.querySelectorAll('[data-cmd]').forEach((b) => b.addEventListener('click', () => API && API.cmd(b.dataset.cmd)));

    // ブックマークと最近閉じたタブを読み込む
    (async () => {
      const grid = document.getElementById('grid');
      let data = null;
      try { data = API ? await API.data() : null; } catch { data = null; }
      const bms = (data && data.bookmarks && data.bookmarks.length) ? data.bookmarks : [
        { title: 'Google', url: 'https://www.google.com' },
        { title: 'YouTube', url: 'https://www.youtube.com' },
        { title: 'GitHub', url: 'https://github.com' },
        { title: 'Wikipedia', url: 'https://ja.wikipedia.org' },
      ];
      for (const b of bms.slice(0, 12)) addShortcut(grid, b.title, b.url);
      if (data && data.engine) document.getElementById('i').placeholder = `${data.engine} で検索 または URL を入力`;
      if (data && data.recentClosed && data.recentClosed.length) {
        document.getElementById('closed-card').hidden = false;
        const box = document.getElementById('closed');
        for (const c of data.recentClosed) {
          const a = document.createElement('a');
          a.href = c.url;
          a.textContent = c.title || c.url;
          a.title = c.url;
          box.appendChild(a);
        }
      }
    })();
  </script>
</body>
</html>
